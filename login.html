<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Muneeb Fast Food</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-neutral-950 text-white flex items-center justify-center h-screen">
    <div class="max-w-md w-full bg-neutral-900 p-8 rounded-3xl border border-yellow-400/10 shadow-xl">
        <h2 class="text-2xl font-bold text-yellow-400 mb-6 text-center">Dashboard Login</h2>
        
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm text-neutral-400 mb-1">Username</label>
                <input type="text" id="username" required class="w-full bg-neutral-800 border border-neutral-700 rounded-lg p-3 text-white">
            </div>
            
            <div>
                <label class="block text-sm text-neutral-400 mb-1">Password</label>
                <input type="password" id="password" required class="w-full bg-neutral-800 border border-neutral-700 rounded-lg p-3 text-white">
            </div>

            <button type="submit" class="w-full bg-yellow-500 hover:bg-yellow-600 text-neutral-950 font-bold p-3 rounded-lg transition">
                Login
            </button>
        </form>
        <p id="error-msg" class="text-sm mt-4 text-center text-red-400"></p>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (res.ok) {
                    // Role ke hisaab se redirect karein
                    localStorage.setItem('userRole', data.role);
                    if (data.role === 'main_admin') {
                    window.location.href = 'admin.html';
                     } else {
                     window.location.href = 'shop-admin.html'; // Shop admin ka alag page
                   }
                } else {
                    document.getElementById('error-msg').innerText = data.error;
                }
            } catch (err) {
                document.getElementById('error-msg').innerText = "Server error occurred.";
            }
        });
    </script>
</body>
</html>
